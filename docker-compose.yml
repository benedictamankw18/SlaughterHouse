services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ultbigboy
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/ultbigboy
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5500}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:5500/payment-success.html}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?Set DOWNLOAD_SIGNING_SECRET in .env}
      CERTIFICATE_SIGNING_SECRET: ${CERTIFICATE_SIGNING_SECRET:?Set CERTIFICATE_SIGNING_SECRET in .env}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - app-data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  app-data:
