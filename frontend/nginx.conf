map $uri $script_sources {
    default "'self' 'unsafe-inline'";
    ~^/(?:beats|booking|index|merchandise|produced|admin|payment-success)\.html$ "'self' 'sha256-XL78bdzNaXSWc4jvroFmjWfuAuS+6z4mV9+Zt+6nvoc=' 'sha256-+j/vp86x/OMAYV6Sp58ZlSC65wkk+5Ve/bFjq1yTiMg=' 'sha256-Wa0mLofalLRXmOknjihbnjJuHPypR8ufZx/3o4Eu2rI=' 'sha256-KCiAR/UqL4hKFDOrshS93jEoHszBDINFgz9ts2p9hkY='";
    / "'self' 'sha256-XL78bdzNaXSWc4jvroFmjWfuAuS+6z4mV9+Zt+6nvoc='";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src $script_sources; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob: https:" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /404.html {
        internal;
    }
}
