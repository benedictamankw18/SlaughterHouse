map $uri $script_sources {
    default "'self'";
    ~^/(?:out|songmeta_[1-4])\.html$ "'self' 'unsafe-inline'";
    ~^/booking\.html$ "'self' 'sha256-aI90G5sPD7f4YuBx5WCMvswyUJTz9yhmLJsAjOYVX40='";
    ~^/index\.html$ "'self' 'sha256-swhcD21i+Yugv5RvOuNuZhfYMxoZaHhWixlammmsKWw='";
    ~^/merchandise\.html$ "'self' 'sha256-UjBeeDfOq49Yuuk5xvl8E68pYlsz7JX8xdCCDnGq03k='";
    ~^/payment-success\.html$ "'self' 'sha256-nGVsFfKCfCaLQItN/nXK65BD5p32r/JGc7D0oST7Co0='";
    / "'self' 'sha256-swhcD21i+Yugv5RvOuNuZhfYMxoZaHhWixlammmsKWw='";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src $script_sources; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self'; media-src 'self' blob: https:" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /404.html {
        internal;
    }
}
