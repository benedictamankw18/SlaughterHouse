map $uri $script_sources {
    default "'self'";
    ~^/(?:out|songmeta_[1-4])\.html$ "'self' 'unsafe-inline'";
    ~^/(?:user/)?booking\.html$ "'self' 'sha256-aI90G5sPD7f4YuBx5WCMvswyUJTz9yhmLJsAjOYVX40='";
    ~^/index\.html$ "'self' 'sha256-swhcD21i+Yugv5RvOuNuZhfYMxoZaHhWixlammmsKWw='";
    ~^/(?:user/)?merchandise\.html$ "'self' 'sha256-UjBeeDfOq49Yuuk5xvl8E68pYlsz7JX8xdCCDnGq03k='";
    ~^/(?:user/)?payment-success\.html$ "'self' 'sha256-DmbzTK4TxvPdo8MNNaWYaeUs5XWrpzkm34J/u1LOsRo='";
    / "'self' 'sha256-swhcD21i+Yugv5RvOuNuZhfYMxoZaHhWixlammmsKWw='";
}

# Preserve the original scheme when an outer TLS proxy sets it; fall back to
# this server's scheme for direct HTTP deployments.
map $http_x_forwarded_proto $forwarded_proto {
    "" $scheme;
    ~^([^,\s]+) $1;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src $script_sources; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self'; media-src 'self' blob: https:" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    error_page 404 /404.html;

    # Keep old public URLs working after the admin/user folder split.
    rewrite ^/(beats|booking|merchandise|produced|payment-success|certificate|verify-certificate|cookies|license-terms|privacy|refunds|terms)\.html$ /user/$1.html last;
    location = /admin.html { return 301 /admin/admin.html$is_args$args; }
    location = /alerts.html { return 301 /user/alerts.html$is_args$args; }
    location = /bookings.html { return 301 /user/bookings.html$is_args$args; }
    location = /downloads.html { return 301 /user/downloads.html$is_args$args; }
    location = /licenses.html { return 301 /user/licenses.html$is_args$args; }
    location = /orders.html { return 301 /user/orders.html$is_args$args; }
    location = /profile.html { return 301 /user/profile.html$is_args$args; }
    location = /purchases.html { return 301 /user/purchases.html$is_args$args; }
    location = /requests.html { return 301 /user/requests.html$is_args$args; }
    location = /wishlist.html { return 301 /user/wishlist.html$is_args$args; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Administrator catalog uploads may include a 5 MB image and 25 MB audio
    # files in one JSON body; keep this above the API's 150 MB parser limit.
    location ^~ /api/admin/ {
        client_max_body_size 160m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location = /api/requests {
        client_max_body_size 25m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location = /404.html {
        internal;
    }
}
