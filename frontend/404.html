<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex,follow">
  <title>Page not found | UltBigBoy</title>
  <link rel="icon" type="image/png" href="/Images/Logo%202.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .not-found-page {
      display: grid;
      min-height: 100vh;
      place-items: center;
      box-sizing: border-box;
      padding: 32px 20px;
      background: radial-gradient(ellipse at 50% 42%, rgba(34, 197, 94, .12), transparent 58%), #080808;
      text-align: center;
    }
    .not-found-content { width: min(620px, 100%); }
    .not-found-logo { width: 92px; height: 92px; margin: 0 auto 28px; object-fit: contain; }
    .not-found-code { margin: 0; color: #86efac; font-size: clamp(5rem, 24vw, 10rem); font-weight: 800; letter-spacing: -.08em; line-height: .9; }
    .not-found-content h1 { margin: 24px 0 12px; font-size: clamp(1.7rem, 7vw, 2.6rem); }
    .not-found-content p { max-width: 470px; margin: 0 auto; color: rgba(255,255,255,.72); line-height: 1.7; }
    .not-found-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    .not-found-links a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; box-sizing: border-box; padding: 10px 18px; border: 1px solid #22c55e; border-radius: 6px; color: #fff; font-weight: 700; text-decoration: none; }
    .not-found-links a:first-child { background: #22c55e; color: #07130a; }
    .not-found-links a:hover { border-color: #86efac; }
    .not-found-links a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    @media (max-width: 420px) { .not-found-links { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="not-found-page">
    <section class="not-found-content" aria-labelledby="not-found-title">
      <a href="/" aria-label="UltBigBoy home"><img class="not-found-logo" src="/Images/Logo%202.png" alt="UltBigBoy"></a>
      <p class="not-found-code" aria-hidden="true">404</p>
      <h1 id="not-found-title">This page missed the beat.</h1>
      <p>The page may have moved, or the address may be incorrect. Head back to the store and keep exploring.</p>
      <nav class="not-found-links" aria-label="Helpful links">
        <a href="/">Back to home</a>
        <a href="/beats.html">Browse beats</a>
        <a href="/produced.html">Listen to releases</a>
      </nav>
    </section>
  </main>
</body>
</html>
